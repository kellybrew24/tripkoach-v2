name: supply-chain

# =============================================================================
# TripKoach v2 — supply-chain / dependency scanning gate.  TRI-1123.
#   Parent TRI-1121 (CTO security remediation, non-P0) · source TRI-1107 memo #3.
#
# SCOPE: repo / CI only. No app code ships; this does NOT ride TRI-1057 (prod
#   cutover). Companion to the TRI-1111 uptime monitor (uptime.yml) on `main`.
#
# WHAT IT DOES, per workspace that owns a lockfile (root + apps/api):
#   1. `npm ci`  — installs from the lockfile and FAILS on lockfile drift
#                  (package.json <-> package-lock.json mismatch = integrity check).
#   2. audit gate — scripts/ci/audit-gate.mjs runs `npm audit --omit=dev --json`
#                  and fails the PR on any HIGH/CRITICAL advisory in production
#                  deps that is not covered by an EXPIRING allow-list entry in
#                  .audit-allowlist.json.  Dev-only + moderate/low never block.
#
# TRIGGERS: every PR to main (the gate), plus push to main (green baseline +
#   catches drift that lands directly), plus manual dispatch.
#
# NOTE: web + admin have no own package.json/lockfile — they build from the root
#   lockfile (esbuild) — so the root row covers them. Add a matrix row here if a
#   per-app lockfile is ever introduced (keep in sync with dependabot.yml).
# =============================================================================

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: root (web+admin)
            dir: .
          - name: apps/api
            dir: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install (npm ci — lockfile integrity gate)
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Audit gate (high/critical, prod deps)
        run: node scripts/ci/audit-gate.mjs "${{ matrix.dir }}"
