<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TripKoach: website UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../mobile-app/data.js"></script>
<script src="blog.js"></script>
<style>
body{margin:0;background:var(--bg-page)}main{min-height:60vh}
/* Responsive layer for the web kit (page-level grids use inline styles; override at breakpoints) */
.tk-only-mobile{display:none}
@media (max-width:1023px){.tk-only-mobile{display:inline-flex}.tk-hide-mobile{display:none !important}}
/* Tablet: split layouts stack; 3/4-up card grids drop to 2-up */
@media (max-width:960px){
  #root [style*="1fr 380px"],#root [style*="1fr 360px"],#root [style*="240px 1fr"],
  #root [style*="1.05fr 0.95fr"],#root [style*="1.1fr 0.9fr"],#root [style*="1.05fr 0.95fr"]{grid-template-columns:1fr !important}
  #root [style*="repeat(3"],#root [style*="repeat(4"]{grid-template-columns:repeat(2,1fr) !important}
}
/* Phone: everything to a single column */
@media (max-width:600px){
  #root [style*="grid-template-columns"]{grid-template-columns:1fr !important}
  #root .tk-blogfeature{flex-direction:column !important}
  #root .tk-blogfeature .tk-media{flex:0 0 auto !important;width:100% !important;aspect-ratio:16/10 !important}
  #root .tk-login{min-height:auto !important}
  .tk-display{font-size:clamp(30px,8vw,44px) !important}
}
</style>
</head><body>
<div id="root"></div>
<script type="text/babel" src="screens-home.jsx"></script>
<script type="text/babel" src="screens-pages.jsx"></script>
<script type="text/babel" src="screens-blog.jsx"></script>
<script type="text/babel" src="screens-account.jsx"></script>
<script type="text/babel" src="screens-web.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body></html>
