<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation" subtitle="Warm-black shadows, max two layers — cards barely lift" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1}.chip{height:56px;border-radius:0}.sw>div:first-child .chip{border-radius:var(--radius-md) 0 0 var(--radius-md)}.sw>div:last-child .chip{border-radius:0 var(--radius-md) var(--radius-md) 0}.n{font-size:10.5px;color:var(--text-muted);margin-top:6px;line-height:1.3}.n b{display:block;color:var(--text-strong);font-size:11px;font-weight:700;letter-spacing:.01em}.row{display:flex;gap:16px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border-subtle)}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle)}</style>
</head><body><div class="row" style="gap:22px"><div style="text-align:center"><div style="width:120px;height:64px;background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--elev-1);border:1px solid var(--border-subtle)"></div><div class="n"><b>elev-1</b>Cards</div></div><div style="text-align:center"><div style="width:120px;height:64px;background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--elev-2);border:1px solid var(--border-subtle)"></div><div class="n"><b>elev-2</b>Hover</div></div><div style="text-align:center"><div style="width:120px;height:64px;background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--elev-3);border:1px solid var(--border-subtle)"></div><div class="n"><b>elev-3</b>Popover, toast</div></div><div style="text-align:center"><div style="width:120px;height:64px;background:var(--surface-card);border-radius:var(--radius-card);box-shadow:var(--elev-4);border:1px solid var(--border-subtle)"></div><div class="n"><b>elev-4</b>Modal</div></div></div></body></html>
