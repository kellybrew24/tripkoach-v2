<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1}.chip{height:56px;border-radius:0}.sw>div:first-child .chip{border-radius:var(--radius-md) 0 0 var(--radius-md)}.sw>div:last-child .chip{border-radius:0 var(--radius-md) var(--radius-md) 0}.n{font-size:10.5px;color:var(--text-muted);margin-top:6px;line-height:1.3}.n b{display:block;color:var(--text-strong);font-size:11px;font-weight:700;letter-spacing:.01em}.row{display:flex;gap:16px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border-subtle)}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle)}</style>
</head><body><div style="display:flex;gap:10px;align-items:flex-end"><div style="text-align:center"><div style="width:calc(var(--space-1));height:calc(var(--space-1));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>1</b>4px</div></div><div style="text-align:center"><div style="width:calc(var(--space-2));height:calc(var(--space-2));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>2</b>8px</div></div><div style="text-align:center"><div style="width:calc(var(--space-3));height:calc(var(--space-3));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>3</b>12px</div></div><div style="text-align:center"><div style="width:calc(var(--space-4));height:calc(var(--space-4));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>4</b>16px</div></div><div style="text-align:center"><div style="width:calc(var(--space-5));height:calc(var(--space-5));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>5</b>20px</div></div><div style="text-align:center"><div style="width:calc(var(--space-6));height:calc(var(--space-6));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>6</b>24px</div></div><div style="text-align:center"><div style="width:calc(var(--space-8));height:calc(var(--space-8));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>8</b>32px</div></div><div style="text-align:center"><div style="width:calc(var(--space-10));height:calc(var(--space-10));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>10</b>40px</div></div><div style="text-align:center"><div style="width:calc(var(--space-12));height:calc(var(--space-12));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>12</b>48px</div></div><div style="text-align:center"><div style="width:calc(var(--space-16));height:calc(var(--space-16));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>16</b>64px</div></div><div style="text-align:center"><div style="width:calc(var(--space-20));height:calc(var(--space-20));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>20</b>80px</div></div><div style="text-align:center"><div style="width:calc(var(--space-24));height:calc(var(--space-24));background:var(--gold-300);border-radius:3px"></div><div class="n"><b>24</b>96px</div></div></div></body></html>
