<!-- @dsCard group="Brand" viewport="700x200" name="Logo" subtitle="Supplied badge; clear space = 25% of diameter" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1}.chip{height:56px;border-radius:0}.sw>div:first-child .chip{border-radius:var(--radius-md) 0 0 var(--radius-md)}.sw>div:last-child .chip{border-radius:0 var(--radius-md) var(--radius-md) 0}.n{font-size:10.5px;color:var(--text-muted);margin-top:6px;line-height:1.3}.n b{display:block;color:var(--text-strong);font-size:11px;font-weight:700;letter-spacing:.01em}.row{display:flex;gap:16px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border-subtle)}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle)}</style>
</head><body><div class="row" style="gap:28px;align-items:center">
<div style="text-align:center"><div style="padding:18px;background:var(--n-0);border:1px dashed var(--border-default);border-radius:var(--radius-card)"><img src="../assets/logo-badge.png" width="72" height="72" alt="TripKoach badge"></div><div class="n"><b>On light</b>Clear space 18px at 72px</div></div>
<div style="text-align:center"><div style="padding:18px;background:var(--n-900);border-radius:var(--radius-card)"><img src="../assets/logo-badge.png" width="72" height="72" alt=""></div><div class="n"><b>On ink</b>Badge is unchanged</div></div>
<div style="display:flex;align-items:center;gap:10px"><img src="../assets/logo-badge.png" width="40" height="40" alt=""><span style="font-weight:800;font-size:20px;letter-spacing:-.03em;color:var(--text-strong)">TripKoach</span></div>
<div class="n" style="max-width:190px"><b>Never</b>recolour, rotate, crop, add effects, or redraw the badge. Minimum size 28px.</div></div></body></html>
