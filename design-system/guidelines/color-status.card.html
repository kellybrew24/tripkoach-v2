<!-- @dsCard group="Colors" viewport="700x150" name="Booking & payment status" subtitle="Gold waits on the customer, green is settled, neutral is closed, red is a fault" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1}.chip{height:56px;border-radius:0}.sw>div:first-child .chip{border-radius:var(--radius-md) 0 0 var(--radius-md)}.sw>div:last-child .chip{border-radius:0 var(--radius-md) var(--radius-md) 0}.n{font-size:10.5px;color:var(--text-muted);margin-top:6px;line-height:1.3}.n b{display:block;color:var(--text-strong);font-size:11px;font-weight:700;letter-spacing:.01em}.row{display:flex;gap:16px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border-subtle)}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle)}</style>
</head><body><div class="row"><div style="flex:1;min-width:100px"><span class="tk-badge tk-badge--pending"><span class="tk-badge__dot"></span>Pending</span><div class="n" style="margin-top:8px">Awaiting payment</div></div><div style="flex:1;min-width:100px"><span class="tk-badge tk-badge--confirmed"><span class="tk-badge__dot"></span>Confirmed</span><div class="n" style="margin-top:8px">Spot held</div></div><div style="flex:1;min-width:100px"><span class="tk-badge tk-badge--cancelled"><span class="tk-badge__dot"></span>Cancelled</span><div class="n" style="margin-top:8px">Closed, not an error</div></div><div style="flex:1;min-width:100px"><span class="tk-badge tk-badge--paid"><span class="tk-badge__dot"></span>Paid</span><div class="n" style="margin-top:8px">Future</div></div><div style="flex:1;min-width:100px"><span class="tk-badge tk-badge--failed"><span class="tk-badge__dot"></span>Payment failed</span><div class="n" style="margin-top:8px">Future</div></div><div style="flex:1;min-width:100px"><span class="tk-badge tk-badge--refunded"><span class="tk-badge__dot"></span>Refunded</span><div class="n" style="margin-top:8px">Future</div></div></div></body></html>
