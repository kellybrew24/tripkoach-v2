<!-- @dsCard group="Colors" viewport="700x150" name="Dark theme" subtitle="data-theme=\"dark\" — gold becomes the action colour" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1}.chip{height:56px;border-radius:0}.sw>div:first-child .chip{border-radius:var(--radius-md) 0 0 var(--radius-md)}.sw>div:last-child .chip{border-radius:0 var(--radius-md) var(--radius-md) 0}.n{font-size:10.5px;color:var(--text-muted);margin-top:6px;line-height:1.3}.n b{display:block;color:var(--text-strong);font-size:11px;font-weight:700;letter-spacing:.01em}.row{display:flex;gap:16px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border-subtle)}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle)}</style>
</head><body><div data-theme="dark" style="background:var(--bg-page);padding:16px;border-radius:var(--radius-card)">
<div class="sw"><div><div class="chip" style="background:var(--bg-page)"></div><div class="n"><b>Page</b>#141312</div></div><div><div class="chip" style="background:var(--surface-card)"></div><div class="n"><b>Card</b>#211E1C</div></div><div><div class="chip" style="background:var(--text-strong)"></div><div class="n"><b>Text</b>16.9:1</div></div><div><div class="chip" style="background:var(--action-primary-bg)"></div><div class="n"><b>Action</b>gold-300</div></div><div><div class="chip" style="background:var(--status-confirmed-fg)"></div><div class="n"><b>Confirmed</b></div></div><div><div class="chip" style="background:var(--status-pending-fg)"></div><div class="n"><b>Pending</b></div></div></div>
<div style="display:flex;gap:8px;margin-top:14px"><button class="tk-btn tk-btn--primary tk-btn--sm">Reserve</button><button class="tk-btn tk-btn--secondary tk-btn--sm">Back</button><span class="tk-badge tk-badge--pending"><span class="tk-badge__dot"></span>Pending</span></div></div></body></html>
