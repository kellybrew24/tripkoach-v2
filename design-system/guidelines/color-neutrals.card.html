<!-- @dsCard group="Colors" viewport="700x140" name="Warm neutrals" subtitle="Backgrounds, borders and text — all warm-tinted, never blue-grey" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1}.chip{height:56px;border-radius:0}.sw>div:first-child .chip{border-radius:var(--radius-md) 0 0 var(--radius-md)}.sw>div:last-child .chip{border-radius:0 var(--radius-md) var(--radius-md) 0}.n{font-size:10.5px;color:var(--text-muted);margin-top:6px;line-height:1.3}.n b{display:block;color:var(--text-strong);font-size:11px;font-weight:700;letter-spacing:.01em}.row{display:flex;gap:16px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border-subtle)}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle)}</style>
</head><body><div class="sw"><div><div class="chip" style="background:var(--n-25)"></div><div class="n"><b>25 page</b>#FDFBF8</div></div><div><div class="chip" style="background:var(--n-50)"></div><div class="n"><b>50 subtle</b></div></div><div><div class="chip" style="background:var(--n-100)"></div><div class="n"><b>100 sunken</b></div></div><div><div class="chip" style="background:var(--n-200)"></div><div class="n"><b>200 border</b></div></div><div><div class="chip" style="background:var(--n-450)"></div><div class="n"><b>450 input border</b>3.7:1</div></div><div><div class="chip" style="background:var(--n-500)"></div><div class="n"><b>500 muted text</b>5.6:1</div></div><div><div class="chip" style="background:var(--n-700)"></div><div class="n"><b>700</b></div></div><div><div class="chip" style="background:var(--n-900)"></div><div class="n"><b>900 text</b>17:1</div></div></div></body></html>
