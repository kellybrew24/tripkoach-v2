<!-- @dsCard group="Colors" viewport="700x140" name="Semantic" subtitle="Success, warning, danger, info — solid and wash pairs" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card</title><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;background:var(--bg-page);font-family:var(--font-sans)}.sw{display:flex;gap:0}.sw>div{flex:1}.chip{height:56px;border-radius:0}.sw>div:first-child .chip{border-radius:var(--radius-md) 0 0 var(--radius-md)}.sw>div:last-child .chip{border-radius:0 var(--radius-md) var(--radius-md) 0}.n{font-size:10.5px;color:var(--text-muted);margin-top:6px;line-height:1.3}.n b{display:block;color:var(--text-strong);font-size:11px;font-weight:700;letter-spacing:.01em}.row{display:flex;gap:16px;flex-wrap:wrap}table{border-collapse:collapse;width:100%;font-size:12px}td,th{text-align:left;padding:5px 8px;border-bottom:1px solid var(--border-subtle)}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-subtle)}</style>
</head><body><div class="sw"><div><div class="chip" style="background:var(--green-600)"></div><div class="n"><b>Success</b>#0E6E52</div></div><div><div class="chip" style="background:var(--green-50)"></div><div class="n"><b>Success wash</b></div></div><div><div class="chip" style="background:var(--gold-600)"></div><div class="n"><b>Warning</b>#AE6413</div></div><div><div class="chip" style="background:var(--gold-50)"></div><div class="n"><b>Warning wash</b></div></div><div><div class="chip" style="background:var(--red-600)"></div><div class="n"><b>Danger</b>#B3261E</div></div><div><div class="chip" style="background:var(--red-50)"></div><div class="n"><b>Danger wash</b></div></div><div><div class="chip" style="background:var(--blue-600)"></div><div class="n"><b>Info</b>#1A5F8A</div></div><div><div class="chip" style="background:var(--blue-50)"></div><div class="n"><b>Info wash</b></div></div></div></body></html>
