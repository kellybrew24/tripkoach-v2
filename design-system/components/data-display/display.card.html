<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--bg-page)}.g{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--text-subtle)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.TripKoachDesignSystem_c9e4af;
const { StatusBadge, AvailabilityBadge, Badge, Chip, Rating, Skeleton, EmptyState, Button } = NS;
function Card(){return <div className="col">
 <div className="g">{['pending','confirmed','cancelled','paid','failed','refunded'].map(s=><StatusBadge key={s} status={s}/>)}</div>
 <div className="g"><AvailabilityBadge spotsLeft={12}/><AvailabilityBadge spotsLeft={3}/><AvailabilityBadge spotsLeft={0}/><Badge tone="solid">Best seller</Badge><Rating value={4.8} count={126}/></div>
 <div className="g"><Chip active onRemove={()=>{}}>Greater Accra</Chip><Chip onRemove={()=>{}}>Under GH₵500</Chip><Chip>Full day</Chip></div>
 <div style={{display:'grid',gridTemplateColumns:'1fr 1.2fr',gap:16,alignItems:'start'}}>
  <div className="col" style={{gap:8}}><Skeleton height={72} radius="var(--radius-card)"/><Skeleton lines={3} height={10}/></div>
  <EmptyState icon="ticket" title="No bookings yet" body="When you reserve a tour it shows up here." action={<Button size="sm">Browse tours</Button>}/>
 </div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
