<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Card</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;background:var(--bg-page)}.g{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.col{display:flex;flex-direction:column;gap:14px}.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--text-subtle)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.TripKoachDesignSystem_c9e4af;
const { FormField, Input, Select, Checkbox, Radio, Switch, NumberStepper, PasswordInput, PhoneInput, SearchField } = NS;
function Card(){const [n,setN]=React.useState(2);return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'18px'}}>
 <FormField id="a" label="Full name" help="As it appears on your ID"><Input defaultValue="Ama Mensah"/></FormField>
 <FormField id="b" label="Email address" required error="Enter a valid email address"><Input defaultValue="ama@"/></FormField>
 <FormField id="c" label="Phone number"><PhoneInput id="c"/></FormField>
 <FormField id="d" label="Region" optional><Select placeholder="All regions" options={[{value:'1',label:'Greater Accra'},{value:'2',label:'Ashanti'}]}/></FormField>
 <FormField id="e" label="Password"><PasswordInput id="e" defaultValue="abc12345" rules={[{label:'8+ characters',met:true},{label:'A number',met:true}]}/></FormField>
 <FormField id="f" label="Disabled"><Input disabled defaultValue="Locked after booking"/></FormField>
 <div><div className="lbl" style={{marginBottom:8}}>Search</div><SearchField value="Cape Coast" onChange={()=>{}} onClear={()=>{}}/></div>
 <div><div className="lbl" style={{marginBottom:8}}>Travellers</div><NumberStepper id="pax" value={n} onChange={setN}/></div>
 <Checkbox id="t1" label="I agree to the booking terms" defaultChecked/>
 <Switch id="s1" label="Data saver" defaultChecked/>
 <Radio card id="r1" name="pm" label="Pay later" description="Reserve now, pay before departure" checked readOnly/>
 <Radio card id="r2" name="pm" label="Pay now by card" description="Coming soon" disabled/>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
